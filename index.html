<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frida</title>
<meta name="description" content="Frida — learning Claude and exploring what AI can build.">
<style>
  :root {
    --cream: #FAF1E4;
    --cream-2: #F3E5D2;
    --terracotta: #C97B4A;
    --terracotta-dark: #B0663A;
    --olive: #5B6B45;
    --ink: #3A2E24;
    --ink-soft: #6B5E4F;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* soft ambient blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  .blob--1 {
    width: 280px;
    height: 280px;
    background: var(--terracotta);
    top: -80px;
    left: -80px;
    animation: drift1 16s ease-in-out infinite;
  }
  .blob--2 {
    width: 240px;
    height: 240px;
    background: var(--olive);
    bottom: -90px;
    right: -70px;
    opacity: 0.25;
    animation: drift2 20s ease-in-out infinite;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, 30px) scale(1.08); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-15px, -20px) scale(1.06); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .rise {
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.6s ease forwards;
  }
  .rise--1 { animation-delay: 0.05s; }
  .rise--2 { animation-delay: 0.18s; }
  .rise--3 { animation-delay: 0.31s; }
  .rise--4 { animation-delay: 0.44s; }
  .rise--5 { animation-delay: 0.57s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--terracotta) 0%, #D9945F 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cream);
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.5px;
    box-shadow: 0 10px 30px rgba(201, 123, 74, 0.35);
    animation: rise 0.6s ease forwards, breathe 5s ease-in-out infinite 0.7s;
    margin-bottom: 20px;
  }

  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 10px 30px rgba(201, 123, 74, 0.35); }
    50% { transform: translateY(-4px) scale(1.03); box-shadow: 0 16px 36px rgba(201, 123, 74, 0.45); }
  }

  h1 {
    margin: 0 0 4px;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
  }

  .tagline {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 600;
    color: var(--olive);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .bio {
    margin: 0 0 32px;
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 320px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }

  .link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    background: var(--terracotta);
    color: var(--cream);
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 8px 20px rgba(201, 123, 74, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .link-btn svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .link-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(201, 123, 74, 0.4);
    background: var(--terracotta-dark);
  }

  .link-btn:active {
    transform: translateY(0) scale(0.96);
    box-shadow: 0 4px 12px rgba(201, 123, 74, 0.35);
  }

  footer {
    margin-top: 36px;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.7;
  }

  @media (min-width: 640px) {
    .card { max-width: 420px; }
    .avatar { width: 108px; height: 108px; font-size: 44px; }
    h1 { font-size: 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rise, .avatar, .blob--1, .blob--2 {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .link-btn { transition: none; }
  }
</style>
</head>
<body>

  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>

  <main class="card">
    <div class="avatar">F</div>
    <h1 class="rise rise--1">Frida</h1>
    <p class="tagline rise rise--2">Learning Claude</p>
    <p class="bio rise rise--3">Frida, learning Claude and exploring what AI can build.</p>

    <div class="links rise rise--4">
      <a class="link-btn" href="https://github.com/fresfrida" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
          -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
          .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
          -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68
          0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56
          .82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
          0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42
          -3.58-8-8-8z"/>
        </svg>
        <span>GitHub</span>
      </a>
    </div>

    <footer class="rise rise--5">made with care, one link at a time</footer>
  </main>

</body>
</html>
